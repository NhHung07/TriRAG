[project]
name = "trirag"
version = "0.1.0"
description = "So sánh các phương pháp truy hồi tri thức trong RAG: BM25, Dense, Hybrid, RAPTOR, LightRAG, SG-RAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "pandas>=2.1",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "networkx>=3.2",
    "google-genai>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
# Embedding / reranker local + phụ thuộc của RAPTOR
ml = [
    "torch>=2.3",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "tenacity>=8.2",
]
lightrag = ["lightrag-hku>=1.4"]
demo = ["streamlit>=1.38", "pymupdf>=1.24"]
all = ["trirag[ml,lightrag,demo]"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trirag"]

# Torch mặc định từ PyPI kèm CUDA 12 (dùng GPU cho embedding/reranker).
# Máy không có GPU / thiếu dung lượng: bỏ comment 2 mục dưới để dùng bản CPU (~nhẹ hơn 4 GB).
# [tool.uv.sources]
# torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
