# Thực nghiệm (A) — So sánh chung trên HotpotQA (distractor, dev, 300 câu hỏi)
experiment: hotpot_common
seed: 42

dataset:
  name: hotpotqa
  path: data/raw/hotpot/hotpot_dev_distractor_v1.json
  n_questions: 300
  stratify: balanced  # 150 bridge + 150 comparison

llm:
  provider: gemini
  model: gemini-2.5-flash
  rpm: 10
  thinking_budget: 0

index_llm:
  provider: gemini
  model: gemini-2.5-flash-lite
  rpm: 15
  thinking_budget: 0

embedding:
  model: BAAI/bge-m3
  device: auto
  batch_size: 32
  max_seq_length: 512

retrieval:
  top_k: 5
  retrieve_k: 10
  context_token_budget: 2000

generation:
  prompt: qa_short
  max_tokens: 64
  temperature: 0.0

methods:
  bm25:
    type: bm25
    k1: 1.5
    b: 0.75

  dense:
    type: dense

  # Cải tiến của nhóm: RRF(BM25, Dense) + Cross-Encoder reranker đa ngữ
  hybrid:
    type: hybrid
    candidates: 30
    rrf_k: 60
    weights: [1.0, 1.2]
    rerank: true
    rerank_pool: 20
    reranker_model: BAAI/bge-reranker-v2-m3

  raptor:
    type: raptor
    mode: collapsed
    leaf_tokens: 250
    num_layers: 3
    summarization_length: 150
    reduction_dimension: 10
    threshold: 0.1

  lightrag:
    type: lightrag
    mode: hybrid
    chunk_token_size: 1200
    chunk_overlap_token_size: 100
    max_gleaning: 0

  # Ablation các chế độ của LightRAG (dùng chung chỉ mục của `lightrag`, không tốn thêm LLM khi index)
  lightrag_local:
    type: lightrag
    mode: local
    share_index_from: lightrag

  lightrag_global:
    type: lightrag
    mode: global
    share_index_from: lightrag

  lightrag_naive:
    type: lightrag
    mode: naive
    share_index_from: lightrag

  sgrag:
    type: sgrag
    max_star_subgraphs: 5
