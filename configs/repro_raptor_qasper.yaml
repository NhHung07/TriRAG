# Thực nghiệm (B1) — Tái lập thu nhỏ RAPTOR trên QASPER (15 bài báo, tối đa 100 câu hỏi)
experiment: repro_raptor_qasper
seed: 42

dataset:
  name: qasper
  path: data/raw/qasper/qasper-dev-v0.3.json
  n_papers: 15
  max_questions: 100

llm:
  provider: gemini
  model: gemini-2.5-flash
  rpm: 10
  thinking_budget: 0

index_llm:
  provider: gemini
  model: gemini-2.5-flash-lite
  rpm: 15
  thinking_budget: 0

embedding:
  model: BAAI/bge-m3
  device: auto
  batch_size: 32
  max_seq_length: 512

retrieval:
  top_k: 5
  retrieve_k: 10
  context_token_budget: 2000

generation:
  prompt: qa_paragraph
  max_tokens: 128
  temperature: 0.0

methods:
  bm25:
    type: bm25

  dense:
    type: dense

  raptor:
    type: raptor
    mode: collapsed
    leaf_tokens: 150
    num_layers: 3
    summarization_length: 150
